# Goal 21 Phase 8 item 3: daily tamper watch for solomonsdigital.com.au.
# Copy of the file that lives at .github/workflows/tamper-watch.yml in nicSolomons/solomons-cards,
# with its script at .github/tamper_watch.py (the deploy sync excludes .github/*, so neither is published).
# Every day: every live card file byte for byte against the committed copy, AND a listing of the bucket that
# fails on any object the repo does not hold (Daniel's audit T10/F15). A failure publishes an alert to the
# solomonsdigital-alerts topic (email to n.goh@). The role may only list the bucket and publish that one topic.
# GitHub pauses scheduled workflows after 60 days without commits: watch_liveness.py (room doctor) catches that.
name: tamper-watch

on:
  schedule:
    - cron: "17 21 * * *"   # 07:17 Sydney (AEST) every day
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::484474575484:role/solomons-cards-alert
          aws-region: ap-southeast-2

      - name: Compare every live file with the published copy, and list the bucket for extras
        run: python3 .github/tamper_watch.py --repo . --inventory

      - name: Alert a person
        if: failure()
        run: |
          aws sns publish --topic-arn arn:aws:sns:ap-southeast-2:484474575484:solomonsdigital-alerts \
            --subject "solomonsdigital.com.au tamper watch FAILED" \
            --message "The daily tamper watch failed: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
