  /* ============ ink only (firm decision 2026-07-30): the Ink structure, one skin ============ */
  :root {
    --canvas:#0b0d10;
    --bg:#14181c;
    --text:#f2efe8;
    --accent:#c9a06a;
    --role:#c9a06a;
    --muted:#9b948a;
    --sub:#a8a094;
    --micro:#7d766b;
    --hairline:rgba(242,239,232,.13);
    --pillborder:rgba(242,239,232,.28);
    --chipborder:rgba(201,160,106,.55);
    --profileborder:rgba(155,148,138,.4);
    --bio:#ded9d0;
    --book-bg:#f2efe8;
    --book-tx:#14181c;
    --book-hv:#ffffff;
    --creds-bg:#0e1114;
    --creds:#6f6a62;
    --afsl:#565149;
    --shadow:0 24px 60px -28px rgba(20,24,28,.5);
    --veil:linear-gradient(to bottom,#14181c 0%,#2a2f34 2%,#4a4f54 4%,#74777a 6%,#9c9d9c 8%,#bfbfbe 10%,#d9d9d9 12%,rgba(217,217,217,0) 18%,rgba(20,24,28,0) 40%,rgba(20,24,28,.22) 53%,rgba(20,24,28,.6) 65%,rgba(20,24,28,.88) 76%,#14181c 85%,#14181c 100%);
  }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { background:var(--canvas); transition:background .3s ease; }
  body { margin:0; font-family:'Manrope',sans-serif; }
  a { color:inherit; text-decoration:none; }

  .shell { max-width:430px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; justify-content:center; }
  @media (min-width:480px) { .shell { padding:40px 0; } }

  .card { width:100%; background:var(--bg); color:var(--text); display:flex; flex-direction:column; box-shadow:var(--shadow); }

  .hd { padding:26px 32px; display:flex; align-items:center; gap:13px; }
  .hd img { width:34px; height:34px; flex:none; }
  .hd .stack { display:flex; flex-direction:column; gap:5px; }
  .hd .word { font-family:'Jost',sans-serif; font-weight:300; font-size:21px; letter-spacing:.26em; line-height:1; color:var(--text); }
  .hd .sub { font-size:7.5px; letter-spacing:.38em; color:var(--sub); }

  .photo { position:relative; height:476px; overflow:hidden; background:#d9d9d9; }
  .photo img { position:absolute; left:0; right:0; bottom:0; width:100%; height:420px; object-fit:cover; }
  .photo .veil { position:absolute; inset:0; background:var(--veil); }
  .overlay { position:absolute; left:32px; right:32px; bottom:22px; display:flex; flex-direction:column; gap:11px; }
  .name { font-family:'EB Garamond',serif; font-size:40px; line-height:1; letter-spacing:-.01em; color:var(--text); }

  .rule-row { display:flex; align-items:center; gap:12px; }
  .rule-row .dash { width:26px; height:1px; background:var(--accent); }
  .rule-row .role { flex:1; font-size:9.5px; letter-spacing:.24em; color:var(--role); }
  .li {
    display:flex; align-items:center; justify-content:center; width:20px; height:20px;
    border:1px solid var(--chipborder); color:var(--role);
    font-family:'Manrope',sans-serif; font-size:10px; font-weight:600; letter-spacing:-.01em; line-height:1;
    transition:background .3s ease, color .3s ease, border-color .3s ease;
  }
  .li:hover { background:var(--accent); color:var(--bg); border-color:var(--accent); }

  .id-block { padding:24px 32px 0; display:flex; flex-direction:column; gap:22px; }
  .bio { font-family:'EB Garamond',serif; font-size:19px; line-height:1.55; color:var(--bio); text-wrap:pretty; }
  .profile-row { display:flex; justify-content:flex-end; margin-top:-12px; }
  .profile-link { font-size:10px; letter-spacing:.1em; color:var(--muted); border-bottom:1px solid var(--profileborder); padding-bottom:3px; transition:color .3s ease, border-color .3s ease; }
  .profile-link:hover { color:var(--role); border-color:var(--accent); }

  .stats { display:flex; gap:22px; padding:20px 0; border-top:1px solid var(--hairline); border-bottom:1px solid var(--hairline); }
  .stat { display:flex; flex-direction:column; gap:5px; }
  .stat .v { font-family:'EB Garamond',serif; font-size:24px; color:var(--text); }
  .stat .k { font-size:8.5px; letter-spacing:.16em; white-space:nowrap; color:var(--muted); }
  .stats .div { width:1px; background:var(--hairline); }

  .ctas { padding:24px 32px 28px; display:flex; flex-direction:column; gap:10px; }
  .book {
    display:flex; align-items:center; justify-content:space-between; padding:18px 20px;
    background:var(--book-bg); color:var(--book-tx);
    font-size:11px; font-weight:600; letter-spacing:.18em;
    transition:transform .35s cubic-bezier(.22,.9,.24,1), background .35s ease;
  }
  .book:hover { background:var(--book-hv); transform:translateY(-2px); }
  .book span:last-child { font-size:13px; }
  .pair { display:flex; gap:10px; }
  .pill {
    flex:1; text-align:center; padding:17px 12px;
    border:1px solid var(--pillborder); color:var(--text);
    font-size:10.5px; font-weight:500; letter-spacing:.16em;
    transition:transform .35s cubic-bezier(.22,.9,.24,1), border-color .35s ease, color .35s ease;
  }
  .pill:hover { border-color:var(--accent); color:var(--role); transform:translateY(-2px); }
  @media (prefers-reduced-motion: reduce) { .book, .pill { transition:none; } .book:hover, .pill:hover { transform:none; } }

  .direct { display:flex; align-items:flex-start; margin-top:16px; border-top:1px solid var(--hairline); padding-top:16px; }
  .direct .col { flex:1; display:flex; flex-direction:column; gap:5px; }
  .direct .lbl { font-size:8px; letter-spacing:.2em; color:var(--micro); }
  .direct .tel { font-size:13px; font-weight:400; letter-spacing:.02em; color:var(--text); transition:color .3s ease; }
  .direct .em { font-size:11.5px; letter-spacing:.01em; color:var(--muted); transition:color .3s ease; }
  .direct .tel:hover, .direct .em:hover { color:var(--role); }
  .direct .vdiv { align-self:stretch; width:1px; background:var(--hairline); margin:0 20px; }
  .save { flex:none; display:flex; flex-direction:column; gap:5px; align-items:flex-end; }
  .save .lbl { font-size:8px; letter-spacing:.2em; color:var(--micro); }
  .save .cta { font-size:11px; font-weight:500; letter-spacing:.14em; color:var(--text); transition:color .3s ease; }
  .save:hover .cta { color:var(--role); }

  .foot { padding:18px 32px 24px; background:var(--creds-bg); display:flex; flex-direction:column; gap:7px; }
  .foot .creds { font-size:9px; letter-spacing:.07em; color:var(--creds); line-height:1.7; }
  .foot .afsl { font-size:8.5px; color:var(--afsl); line-height:1.6; }
</style>
</head>
<body>
<div class="shell">
